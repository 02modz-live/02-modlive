  
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>02 MODZ LIVE</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at top, #14295a 0%, transparent 55%),
    linear-gradient(135deg, #030611, #100625, #031522);
}

body::before {
  content: "";
  position: fixed;
  inset: -50%;
  background: conic-gradient(
    transparent,
    #00e5ff55,
    transparent,
    #a020f055,
    transparent,
    #00e5ff55
  );
  animation: rotate 12s linear infinite;
  z-index: -1;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

.card {
  width: 90%;
  max-width: 390px;
  padding: 35px 22px;
  text-align: center;
  border: 1px solid #00e5ff;
  border-radius: 25px;
  background: #080d20eF;
  box-shadow: 0 0 30px #00d9ff35;
  animation: appear 1s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.live {
  display: inline-block;
  color: #00f5ff;
  border: 1px solid #00e5ff;
  border-radius: 20px;
  padding: 8px 15px;
  font-size: 12px;
  letter-spacing: 3px;
  margin-bottom: 28px;
}

h1 {
  font-size: 35px;
  line-height: 1.4;
  font-weight: 900;
  text-shadow: 0 0 18px #00e5ff70;
}

h1 span {
  color: #00e5ff;
}

.line {
  width: 75px;
  height: 3px;
  margin: 20px auto;
  background: linear-gradient(90deg, #00e5ff, #a020f0);
  border-radius: 5px;
}

p {
  color: #b8c6e5;
  font-size: 14px;
  line-height: 1.8;
}

.start {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  margin-top: 30px;
  padding: 16px;
  color: #03101b;
  text-decoration: none;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 2px;
  border-radius: 12px;
  background: linear-gradient(100deg, #00e5ff, #65f6ff);
  box-shadow: 0 0 20px #00e5ff55;
  transition: .25s;
}

.start:active {
  transform: scale(.96);
}

.footer {
  margin-top: 28px;
  color: #7786a8;
  font-size: 11px;
  letter-spacing: 2px;
}

</style>
</head>

<body>

<div class="card">

  <div class="live">● LIVE ACCESS</div>

  <h1>
    WELCOME TO<br>
    <span>02 MODZ LIVE</span>
  </h1>

  <div class="line"></div>

  <p>
    YOUR LIVE MATCH CENTER<br>
    Click below to continue
  </p>

  <a class="start"
     href="https://mediakorahd.com/matches-today/">
     ▶ START NOW
  </a>

  <div class="footer">
    02 MODZ LIVE • ALL RIGHTS RESERVED
  </div>

</div>

</body>
</html>
